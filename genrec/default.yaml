num_proc: 1
cache_dir: cache/       # Usually for raw and processed data
log_dir: logs/
tensorboard_log_dir: tensorboard/
ckpt_dir: ckpt/
run_id: genrec_default  # Change this to your customized run id
rand_seed: 2026
reproducibility: True

train_batch_size: 256
eval_batch_size: 64
lr: 0.001
weight_decay: 0.15
warmup_steps: 10000
steps: ~
epochs: 200
max_grad_norm: 1.0
eval_interval: 1
patience: 50

topk: [5,10,20,50]
metrics: [ndcg,recall,err]
val_metric: ndcg@10


num_workers: 4
pin_memory: True
persistent_workers: True
prefetch_factor: 2


